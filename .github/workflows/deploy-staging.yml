name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    branches: [staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Immutable Git revision to deploy (optional; defaults to staging HEAD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       vars.STAGING_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Resolve deployment revision
        id: resolve
        env:
          INPUT_REV: ${{ inputs.revision }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_REV" ]; then
            echo "rev=$INPUT_REV" >> "$GITHUB_OUTPUT"
          elif [ -n "$RUN_SHA" ]; then
            echo "rev=$RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "rev=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.rev }}
          fetch-depth: 0
      - name: Verify the revision belongs to staging
        env:
          DEPLOY_REV: ${{ steps.resolve.outputs.rev }}
        run: |
          git fetch origin staging
          git merge-base --is-ancestor "$DEPLOY_REV" origin/staging
      - name: Validate deployment configuration
        run: docker compose -f compose.yml -f compose.production.yml -f compose.staging.yml config --quiet
      - name: Deploy exact staging revision
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_REV: ${{ steps.resolve.outputs.rev }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          STAGING_HTTP_PORT: ${{ vars.STAGING_HTTP_PORT || '3005' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_REV,APP_PATH,STAGING_HTTP_PORT
          script: |
            set -eu
            cd "$APP_PATH"
            git fetch --depth=1 origin "$DEPLOY_REV"
            git checkout --detach "$DEPLOY_REV"
            docker compose -f compose.yml -f compose.production.yml -f compose.staging.yml up -d --build --remove-orphans
            curl --retry 10 --retry-connrefused --retry-delay 2 --fail --silent --show-error http://localhost:${STAGING_HTTP_PORT:-3005}/api/v1/health/ready
