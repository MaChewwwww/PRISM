name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Immutable Git revision to deploy (optional; defaults to main HEAD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - name: Resolve deployment revision
        id: resolve
        env:
          INPUT_REV: ${{ inputs.revision }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_REV" ]; then
            echo "rev=$INPUT_REV" >> "$GITHUB_OUTPUT"
          elif [ -n "$RUN_SHA" ]; then
            echo "rev=$RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "rev=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.rev }}
          fetch-depth: 0
      - name: Verify revision belongs to main
        env:
          DEPLOY_REV: ${{ steps.resolve.outputs.rev }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$DEPLOY_REV" origin/main
      - name: Validate production Compose
        run: docker compose -f compose.yml -f compose.production.yml config --quiet
      - name: Build immutable deployment images
        run: docker compose -f compose.yml -f compose.production.yml build
      - name: Deploy exact revision over SSH on port 80
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_REV: ${{ steps.resolve.outputs.rev }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_REV,APP_PATH
          script: |
            set -eu
            cd "$APP_PATH"
            git reset --hard
            git clean -fd
            git fetch --depth=1 origin "$DEPLOY_REV"
            git checkout --detach "$DEPLOY_REV"
            docker compose -f compose.yml -f compose.production.yml up -d --build --remove-orphans
            PRISM_HTTP_PORT="$(sed -n -E 's/^PRISM_HTTP_PORT=([0-9]+)$/\1/p' .env | tail -n 1)"
            PRISM_HTTP_PORT="${PRISM_HTTP_PORT:-80}"
            curl --retry 10 --retry-connrefused --retry-delay 2 --fail --silent --show-error \
              "http://localhost:${PRISM_HTTP_PORT}/api/v1/health/ready"
