name: prism
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      API_INTERNAL_URL: http://backend:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        ALPACA_CLI_VERSION: v0.0.13
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://shadowfund:shadowfund@postgres:5432/shadowfund
      REDIS_URL: redis://redis:6379/0
      ALPACA_PAPER: "true"
      ALPACA_LIVE_TRADE: "false"
    ports:
      - "${BACKEND_PORT:-8005}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        ALPACA_CLI_VERSION: v0.0.13
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://shadowfund:shadowfund@postgres:5432/shadowfund
      ALPACA_PAPER: "true"
      ALPACA_LIVE_TRADE: "false"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: shadowfund
      POSTGRES_USER: shadowfund
      POSTGRES_PASSWORD: shadowfund
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowfund -d shadowfund"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2.3-alpine
    profiles: ["cache"]
    ports:
      - "${REDIS_PORT:-6385}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
